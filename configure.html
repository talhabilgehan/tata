<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TATA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#0f0f0f;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}
.card{
width:380px;
background:#181818;
border-radius:20px;
padding:36px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}
h1{
font-size:38px;
letter-spacing:4px;
margin-bottom:12px;
}
p{
color:#b5b5b5;
margin-bottom:30px;
line-height:1.5;
}
button{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:white;
color:black;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.2s;
}
button:hover{
transform:translateY(-2px);
}
small{
display:block;
margin-top:18px;
color:#777;
}
</style>
</head>
<body>

<div class="card">
<h1>TATA</h1>

<p>
Premium Live TV
</p>

<button id="install">
Install Addon
</button>

<small>100 Kanal · 5 Kategori</small>

</div>

<script>
document.getElementById("install").onclick=()=>{
const base=window.location.origin;
const host = window.location.host;
window.location.href = `stremio://${host}/manifest.json`;
};
</script>

</body>
</html>
